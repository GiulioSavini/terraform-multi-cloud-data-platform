name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three jobs, each able to fail the build.
#
# There is no continue-on-error, no `|| true` and no exit-code override in this
# file, and none should be added: a check that cannot fail the build reports
# green regardless of what it finds, which is worse than not running it at all.
# If a check becomes too noisy, fix the finding or delete the check.

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.64.0"
  CONFTEST_VERSION: "0.69.0"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      # Every root and adapter is initialised separately; without a shared
      # plugin cache each one would re-download the same providers.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tfcache
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init and validate every module
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          while read -r dir; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null || status=1
            terraform -chdir="$dir" validate || status=1
            echo "::endgroup::"
          done < <(find . -name versions.tf -not -path './.git/*' -printf '%h\n' | sort)
          exit $status

      - name: Bounded context boundaries
        run: ./scripts/check-boundaries.sh

      - name: Provider pins agree
        run: ./scripts/check-provider-pins.sh

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

  policy:
    name: Compliance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conftest
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Policy unit tests
        run: conftest verify --policy compliance/policies

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan Terraform for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # Findings fail the build. Suppressions belong in .trivyignore with a
          # written reason next to them, not in the exit code.
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
